<!--
  highzmash.com's own Web3Forms access key (previously shared with
  mash-engineering-website's Contact component - given its own key on
  2026-10-02 so submissions from each property are distinguishable in the
  Web3Forms dashboard, not just by subject line). hCaptcha script below
  loads with recaptchacompat=off - without it, hCaptcha's default
  compatibility shim injects a g-recaptcha-response field alongside the
  real response, which Web3Forms' backend misreads as a reCAPTCHA
  (paid-only) submission attempt and rejects. Same bug found and fixed on
  jonmash.com's contact form; this is a plain HTML POST with no client-side
  handler, so submission works with JavaScript disabled; hCaptcha's script
  is the only JS dependency, and it degrades to Web3Forms rejecting the
  submission rather than a broken page.
-->
<form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
  <input type="hidden" name="access_key" value="9497b803-8dab-4e6b-b195-c10521713d8f">
  <input type="hidden" name="subject" value="New message from highzmash.com contact form">
  <input type="hidden" name="redirect" value="https://highzmash.com/contact-success/">
  <input type="checkbox" name="botcheck" class="contact-form__botcheck" tabindex="-1" aria-hidden="true" autocomplete="off">

  <div class="form-group">
    <label for="contact-name">Name *</label>
    <input type="text" id="contact-name" name="name" required placeholder="Your name">
  </div>

  <div class="form-group">
    <label for="contact-email">Email *</label>
    <input type="email" id="contact-email" name="email" required placeholder="your.email@company.com">
  </div>

  <div class="form-group">
    <label for="contact-company">Company</label>
    <input type="text" id="contact-company" name="company" placeholder="Your company (optional)">
  </div>

  <div class="form-group">
    <label for="contact-message">Message *</label>
    <textarea id="contact-message" name="message" rows="6" required placeholder="What are you building, and what's the hard part?"></textarea>
  </div>

  <div class="form-group contact-form__captcha">
    <div class="h-captcha" data-sitekey="50b2fe65-b00b-4b9e-ad62-3ba471098be2" data-theme="dark"></div>
  </div>

  <button type="submit" class="contact-form__submit">Send message</button>
</form>
<script src="https://js.hcaptcha.com/1/api.js?recaptchacompat=off" async defer></script>
