<!--
  Shared contact pattern (MAS-21): same Web3Forms access key and hCaptcha
  sitekey as mash-engineering-website's Contact component. Plain HTML POST
  with no client-side handler, so submission works with JavaScript disabled;
  hCaptcha's script is the only JS dependency, and it degrades to Web3Forms
  rejecting the submission rather than a broken page.
-->
<form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
  <input type="hidden" name="access_key" value="a9c2252a-3838-4c21-92d3-a7bfb749cbff">
  <input type="hidden" name="subject" value="New message from highzmash.com contact form">
  <input type="hidden" name="redirect" value="https://highzmash.com/contact-success/">
  <input type="checkbox" name="botcheck" class="contact-form__botcheck" tabindex="-1" aria-hidden="true" autocomplete="off">

  <div class="form-group">
    <label for="contact-name">Name *</label>
    <input type="text" id="contact-name" name="name" required placeholder="Your name">
  </div>

  <div class="form-group">
    <label for="contact-email">Email *</label>
    <input type="email" id="contact-email" name="email" required placeholder="your.email@company.com">
  </div>

  <div class="form-group">
    <label for="contact-company">Company</label>
    <input type="text" id="contact-company" name="company" placeholder="Your company (optional)">
  </div>

  <div class="form-group">
    <label for="contact-message">Message *</label>
    <textarea id="contact-message" name="message" rows="6" required placeholder="What are you building, and what's the hard part?"></textarea>
  </div>

  <div class="form-group contact-form__captcha">
    <div class="h-captcha" data-sitekey="50b2fe65-b00b-4b9e-ad62-3ba471098be2" data-theme="dark"></div>
  </div>

  <button type="submit" class="contact-form__submit">Send message</button>
</form>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
